<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nederlands</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body style="margin:0;background:#0a0e17">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#6b7a96;font-family:system-ui;font-size:16px">
        Laden... 🇳🇱
      </div>
    </div>
    <script>
      fetch('./app.jsx')
        .then(function(r) { return r.text(); })
        .then(function(code) {
          var result = Babel.transform(code, { presets: ['react'], filename: 'app.jsx' });
          var s = document.createElement('script');
          s.text = result.code;
          document.body.appendChild(s);
        })
        .catch(function(err) {
          document.getElementById('root').innerHTML =
            '<div style="color:#e76f51;font-family:system-ui;padding:40px;text-align:center">' +
            '<b>Fout bij laden:</b><br><code>' + err.message + '</code><br><br>' +
            'Open via <b>http://localhost:8000</b> (niet als file://)</div>';
        });
    </script>
  </body>
</html>
